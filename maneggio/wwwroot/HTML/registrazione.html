<!DOCTYPE html>

<html lang="it">

<head>

    <meta charset="UTF-8">

    <title>Registrazione - Maneggio</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: url("sfondo.jpg") no-repeat center;
            background-size: cover;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

            button:hover {
                background: #cc5200;
            }

        .link {
            text-align: center;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Registrati</h2>

        <form onsubmit="return validaRegistrazione()">

            <input type="text" id="nome" placeholder="Nome">

            <input type="text" id="cognome" placeholder="Cognome">

            <input type="email" id="email" placeholder="Email">

            <input type="password" id="password" placeholder="Password">

            <input type="password" id="confermaPassword" placeholder="Conferma Password">

            <select id="livello">

                <option value="">Livello esperienza</option>

                <option>Principiante</option>

                <option>Intermedio</option>

                <option>Esperto</option>

            </select>

            <button type="submit">Registrati</button>

        </form>

        <div class="link">

            <a href="login.html">Hai già un account? Accedi</a>

        </div>

    </div>
    <a class="back-link" href="index.html">⬅ Torna alla Pagina Principale</a>
    <script src="script.js"></script>
</body>
</html>
