<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Prenota</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <!-- calendario moderno -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

    <h1>Prenotazione</h1>

    <form action="conferma.html" method="get" class="form" onsubmit="return validaForm() && prenota()">

        <input type="text" id="nome" name="nome" placeholder="Nome">

        <input type="text" id="data" name="Data">

        <label>Tipo attività:</label>
        <select id="tipo" name="tipo" onchange="aggiornaOrari()">
            <option value="lezione">Lezione</option>
            <option value="passeggiata">Passeggiata</option>
        </select>

        <label>Scegli orario:</label>
        <select id="orario" name="orario"></select>

        <label>Scegli cavallo:</label>
        <select id="cavallo" name="cavallo" onchange="controllaDisponibilita()">
            <option value="1">Spirit</option>
            <option value="2">Golia</option>
            <option value="3">Kiwi</option>
            <option value="4">Mango</option>
            <option value="5">Cookies</option>
            <option value="6">Escobar</option>
            <option value="7">Eclipse</option>
            <option value="8">Furia</option>
            <option value="9">Star</option>
        </select>


        <div id="risultato"></div>

        <button type="submit">Prenota</button>
        s
        <script>
    </form>
    <a class="back-link" href="index.html">⬅ Torna alla Pagina Principale</a>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../JS/script.js"></script>

</body>
</html>
